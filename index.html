<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AfflixNova — Earn by Sharing What You Love</title>
<link rel="icon" type="image/png" href="assets/afflixnova-icon.png">
<link rel="stylesheet" href="styles.css">

<div class="site-content">

  <!-- Desktop navbar -->
  <nav class="navbar desktop-nav">
    <a href="/" class="logo">
      <img src="assets/afflixnova-logo.png" alt="AfflixNova" class="logo-img">
      <span class="logo-text"><span class="t-afflix">Afflix</span><span class="t-nova">Nova</span></span>

    <ul class="nav-links">
